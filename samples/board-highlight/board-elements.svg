<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <title>Тестовая плата — шесть элементов с ID</title>
  <desc>Квадраты R1, R2, C1, C2, D1, U1. Для изменения цвета задайте атрибут fill нужного прямоугольника.</desc>
  <rect width="960" height="640" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#334155">
    <text x="60" y="65" font-size="32" font-weight="bold">Проверка платы</text>
  </g>
  <!-- У каждого элемента собственный ID и fill. Меняйте fill для закрашивания. -->
  <g stroke="#64748b" stroke-width="3">
    <rect id="R1" x="90" y="155" width="160" height="160" fill="#e2e8f0"/>
    <rect id="R2" x="400" y="155" width="160" height="160" fill="#e2e8f0"/>
    <rect id="C1" x="710" y="155" width="160" height="160" fill="#e2e8f0"/>
    <rect id="C2" x="90" y="385" width="160" height="160" fill="#e2e8f0"/>
    <rect id="D1" x="400" y="385" width="160" height="160" fill="#e2e8f0"/>
    <rect id="U1" x="710" y="385" width="160" height="160" fill="#e2e8f0"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#334155">
    <text x="170" y="348">R1</text>
    <text x="480" y="348">R2</text>
    <text x="790" y="348">C1</text>
    <text x="170" y="578">C2</text>
    <text x="480" y="578">D1</text>
    <text x="790" y="578">U1</text>
  </g>
</svg>
